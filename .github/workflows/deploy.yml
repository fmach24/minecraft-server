name: Deploy Minecraft Stack

on:
  push:
    branches: [ main ]  # ON PUSH TO MAIN BRANCH

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Ansible
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.REMOTE_HOST }} >> ~/.ssh/known_hosts

      - name: Run Ansible Playbook
        env:
          # Wyłączamy sprawdzanie klucza hosta dla dodatkowej stabilności w CI
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: |
          ansible-playbook -i ansible/inventory.ini ansible/playbook.yml \
          --extra-vars "target_host=${{ secrets.REMOTE_HOST }} ansible_ssh_private_key_file=~/.ssh/id_ed25519"